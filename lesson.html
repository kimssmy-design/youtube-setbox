<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도덕 수업</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lesson.css">
</head>
<body class="locked at-home">

<!-- 접속 암호 화면 -->
<div id="gate" class="gate"></div>

<!-- 메인 화면 -->
<div id="home" class="home"></div>

<!-- 왼쪽 패널: 단원 목록과 설정 -->
<aside id="side">
  <div class="side-top">
    <button class="mini" id="homeBtn">‹ 메인</button>
    <button class="mini" id="helpBtn">? 사용법</button>
  </div>
  <select id="gradeSel" class="grade-sel" aria-label="학년 선택"></select>
  <nav id="tree" class="tree"></nav>
  <div class="side-foot">
    <div class="foot-row">
      <span class="foot-label">글씨 크기</span>
      <button class="mini" id="fontDown" aria-label="글씨 작게">가 −</button>
      <button class="mini" id="fontUp" aria-label="글씨 크게">가 ＋</button>
    </div>
    <div class="foot-row">
      <button class="mini grow" id="fullBtn">전체 화면</button>
      <a class="mini grow" href="./">영상 모음</a>
    </div>
    <button class="mini wide" id="editBtn">편집 켜기</button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<!-- 본문 -->
<main>
  <div class="top">
    <button class="menu-btn" id="menuBtn" aria-label="단원 목록 열고 닫기">☰</button>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="board">판서</button>
      <button class="tab" data-tab="files">자료</button>
      <button class="tab" data-tab="video">영상</button>
    </div>
    <div class="crumb" id="crumb"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="bar" id="bar">
    <button class="btn" id="prevBtn">◀ 이전 줄</button>
    <button class="btn main" id="nextBtn">다음 줄 ▶</button>
    <button class="btn" id="allBtn">전체 보기</button>
    <button class="btn" id="resetBtn">처음부터</button>
    <span class="count" id="count"></span>
  </div>
</main>

<div id="modalRoot"></div>
<div id="viewer" class="viewer"></div>
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
