<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도덕 수업</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lesson.css">
</head>
<body class="locked" data-view="home">

<!-- 접속 암호 -->
<div id="gate" class="gate"></div>

<!-- 메인: 차시 고르기 -->
<div id="home" class="screen home"></div>

<!-- 수업: 표지 → ① 인트로 ② 판서 ③ 복습 ④ 영상 -->
<div id="run" class="screen run">
  <!-- 위: 차시 이름만 (버튼은 손이 닿기 쉬운 아래 줄에 모음) -->
  <header class="run-top">
    <div class="run-title" id="runTitle"></div>
  </header>
  <div class="stage" id="stage"></div>
  <footer class="run-bar">
    <button class="mini" id="runBack">‹ 목록</button>
    <span class="bsep"></span>
    <nav class="steps" id="runSteps" aria-label="수업 단계"></nav>
    <span class="bsep"></span>
    <div class="run-tools">
      <button class="mini" id="penBtn" title="펜: 화면 위에 바로 쓰기 (P 키)" aria-label="펜">✎</button>
      <button class="mini" id="blankBtn" title="핵심어를 빈칸으로 먼저 보여 주기 (B 키)">빈칸 끔</button>
      <button class="mini" id="fontDown" title="글씨 작게" aria-label="글씨 작게">−</button>
      <button class="mini" id="fontUp" title="글씨 크게" aria-label="글씨 크게">＋</button>
      <button class="mini" id="runPrep" title="이 차시 준비(고치기)">📝 준비</button>
      <button class="mini" id="fullBtn" title="전체 화면 켜고 끄기">⛶ 전체</button>
    </div>
    <span class="where" id="where"></span>
    <button class="btn" id="prevBtn" aria-label="이전">◀</button>
    <button class="btn main" id="nextBtn">다음 ▶</button>
  </footer>
</div>

<!-- 준비: 한 차시 내용 채우기 -->
<div id="prep" class="screen prep"></div>

<div id="modalRoot"></div>
<div id="viewer" class="viewer"></div>
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
