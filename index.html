<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>도덕 수업</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lesson.css">
</head>
<body class="locked" data-view="home">

<!-- 접속 암호 -->
<div id="gate" class="gate"></div>

<!-- 메인: 차시 고르기 -->
<div id="home" class="screen home"></div>

<!-- 수업: ① 화두 ② 판서 ③ 교과서 ④ 영상 -->
<div id="run" class="screen run">
  <header class="run-top">
    <button class="mini" id="runBack">‹ 목록</button>
    <div class="run-title" id="runTitle"></div>
    <nav class="steps" id="runSteps" aria-label="수업 단계"></nav>
    <div class="run-tools">
      <button class="mini" id="runPrep">✎ 준비</button>
      <button class="mini" id="fontDown" aria-label="글씨 작게">가 −</button>
      <button class="mini" id="fontUp" aria-label="글씨 크게">가 ＋</button>
      <button class="mini" id="fullBtn">전체 화면</button>
    </div>
  </header>
  <div class="stage" id="stage"></div>
  <footer class="run-bar">
    <button class="btn" id="prevBtn" aria-label="이전">◀</button>
    <button class="btn main" id="nextBtn">다음 ▶</button>
    <span class="where" id="where"></span>
  </footer>
</div>

<!-- 준비: 한 차시 내용 채우기 -->
<div id="prep" class="screen prep"></div>

<div id="modalRoot"></div>
<div id="viewer" class="viewer"></div>
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
